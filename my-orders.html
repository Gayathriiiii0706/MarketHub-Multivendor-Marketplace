<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MarketHub | My Orders</title>

<link rel="stylesheet" href="css/style.css">

</head><body><!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        <img src="images/logo.jpeg" alt="Market Hub Logo">
        Market<span>Hub</span>
    </div>

    <nav class="navbar">
        <a href="Index.html">Home</a>
        <a href="Products.html">Products</a>
        <a href="#">Categories</a>
        <a href="#">Become a Vendor</a>
    </nav>

    <div class="header-actions">

        <a href="Cart.html" class="cart">
            🛒
            <span id="cartCount">0</span>
        </a>

        <a href="Index.html" class="login-btn">
            Home
        </a>

    </div>

</header>


<!-- ================= MY ORDERS ================= -->

<section class="section">

    <div class="section-heading">

        <div>
            <p class="section-label">YOUR ACCOUNT</p>
            <h2>My Orders</h2>
        </div>

    </div>


    <div id="myOrders">

        <p>Loading your orders...</p>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer>

    <div class="footer-grid">

        <div>

            <div class="logo">
                🛍️ Market<span>Hub</span>
            </div>

            <p>
                A multi-vendor marketplace connecting
                customers with trusted sellers.
            </p>

        </div>

    </div>

    <div class="copyright">
        © 2026 MarketHub. All Rights Reserved.
    </div>

</footer>


<script src="js/main.js"></script>

<script>

    document.addEventListener("DOMContentLoaded", function () {

        loadMyOrders();

    });


    async function loadMyOrders() {

        const container = document.getElementById("myOrders");

        const user = JSON.parse(
            localStorage.getItem("marketHubUser")
        );

        if (!user) {

            container.innerHTML = `
                <p>Please login to view your orders.</p>

                <a href="Login.html" class="primary-btn">
                    Login
                </a>
            `;

            return;
        }


       try {

    const response = await fetch(
        "http://127.0.0.1:8000/api/orders/customer-orders/?email=" +
        encodeURIComponent(user.email)
    );

    const data = await response.json();

            if (!response.ok) {

                container.innerHTML = `
                    <p>Unable to load orders.</p>
                `;

                return;
            }


            if (!data.orders || data.orders.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">

                        <h3>No Orders Yet</h3>

                        <p>
                            You have not placed any orders.
                        </p>

                        <a href="Products.html" class="primary-btn">
                            Start Shopping
                        </a>

                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            data.orders.forEach(order => {

                const orderCard =
                    document.createElement("div");

                orderCard.className = "order-card";


                orderCard.innerHTML = `

                    <div>

                        <h3>
                            Order #${order.order_id}
                        </h3>

                        <p>
                            Product:
                            <strong>
                                ${order.product}
                            </strong>
                        </p>

                        <p>
                            Quantity:
                            ${order.quantity}
                        </p>

                        <p>
                            Amount:
                            <strong>
                                ₹${order.amount}
                            </strong>
                        </p>

                        <p>
                            Status:
                            <strong>
                                ${order.status}
                            </strong>
                        </p>

                    </div>

                `;


                container.appendChild(orderCard);

            });


        } catch (error) {

            console.error(
                "Error loading customer orders:",
                error
            );

            container.innerHTML = `

                <p>
                    Unable to connect to Django server.
                </p>

            `;

        }

    }

</script>

</body>
</html>
